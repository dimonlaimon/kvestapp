<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор хэшей</title>
<style>
  body { font-family: -apple-system, "Roboto", sans-serif; background: #eef2f6;
    margin: 0; padding: 24px; max-width: 420px; margin-left: auto; margin-right: auto; }
  h2 { color: #1a2b4a; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #dfe4ee; border-radius: 12px;
    margin-bottom: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
  .btn { background: #0077ff; color: #fff; border: none; padding: 12px; border-radius: 12px;
    font-weight: 700; cursor: pointer; width: 100%; font-size: 15px; }
  .result { background: #fff; border-radius: 12px; padding: 12px; margin-top: 14px;
    font-size: 12px; word-break: break-all; color: #333; box-shadow: 0 2px 10px rgba(20,40,90,.08);
    display: none; }
  .result b { display: block; color: #1a2b4a; margin-bottom: 6px; font-size: 13px; }
</style>
</head>
<body>
<h2>🔑 Генератор хэшей</h2>
<input type="password" id="pwd" placeholder="Введите пароль">
<button class="btn" onclick="calc()">Получить хэш</button>
<div class="result" id="res"><b>Скопируйте эту строку:</b><span id="hash"></span></div>

<script>
  function calc() {
    const val = document.getElementById("pwd").value;
    if (!val) return;
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(val)).then(buf => {
      const h = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
      document.getElementById("hash").innerText = h;
      document.getElementById("res").style.display = "block";
      document.getElementById("pwd").value = "";
    });
  }
</script>
</body>
</html>
